<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      // The Angular apps use path-based routing; GitHub Pages has no rewrite rules,
      // so send any deep link back to the app shell that owns it.
      (function () {
        var m = window.location.pathname.match(/^(\/[^/]+\/(?:before|after)\/)/);
        window.location.replace(m ? m[1] : '/bofa-demo-app/');
      })();
    </script>
  </head>
  <body></body>
</html>
